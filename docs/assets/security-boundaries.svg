<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">TruePerp market structure and security boundaries</title>
  <desc id="desc">A Uniswap base-cash pool supplies price observations to the TruePerp engine. Traders post margin to the engine. A separate cash vault is the counterparty and is funded by vault liquidity providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182a51"/>
      <stop offset="1" stop-color="#213d68"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162c46"/>
      <stop offset="1" stop-color="#17485a"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d283f"/>
      <stop offset="1" stop-color="#4a3458"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#63d8ef"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e6ba62"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f5f8ff; }
      .heading { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f5f8ff; }
      .body { font: 400 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #c7d3e8; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #aebdd5; }
      .tag { font: 650 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #eef4ff; }
      .box { stroke: #6d82a7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="title">One market, one underlying, two distinct pools</text>
  <text x="600" y="82" text-anchor="middle" class="body">Example: ETH/USDC spot pool → synthetic ETH perpetual → USDC settlement</text>

  <rect x="65" y="145" width="290" height="250" rx="20" class="box" fill="url(#pool)"/>
  <circle cx="132" cy="215" r="32" fill="#7b78ff" opacity="0.92"/>
  <path d="M132 178 L108 216 L132 230 L156 216 Z M132 234 L108 220 L132 257 L156 220 Z" fill="#f5f2ff" opacity="0.9"/>
  <text x="180" y="202" class="heading">Reference pool</text>
  <text x="180" y="228" class="body">Uniswap v4 ETH/USDC</text>
  <text x="92" y="292" class="body">• Holds real spot liquidity</text>
  <text x="92" y="320" class="body">• Produces tick observations</text>
  <text x="92" y="348" class="body">• Supplies swap callbacks</text>
  <text x="92" y="376" class="body">• Does not pay trader PnL</text>

  <rect x="455" y="145" width="290" height="250" rx="20" class="box" fill="url(#engine)"/>
  <rect x="493" y="184" width="48" height="48" rx="10" fill="#54c8df" opacity="0.9"/>
  <path d="M505 208 H529 M517 196 V220" stroke="#092033" stroke-width="4" stroke-linecap="round"/>
  <text x="562" y="202" class="heading">TruePerp engine</text>
  <text x="562" y="228" class="body">Risk and settlement logic</text>
  <text x="482" y="292" class="body">• Custodies trader margin</text>
  <text x="482" y="320" class="body">• Records long/short exposure</text>
  <text x="482" y="348" class="body">• Applies guarded prices</text>
  <text x="482" y="376" class="body">• Reduces unsafe positions</text>

  <rect x="845" y="145" width="290" height="250" rx="20" class="box" fill="url(#vault)"/>
  <rect x="883" y="182" width="52" height="52" rx="9" fill="#d6a84d" opacity="0.95"/>
  <circle cx="909" cy="208" r="13" fill="none" stroke="#4a3458" stroke-width="4"/>
  <text x="956" y="202" class="heading">Counterparty vault</text>
  <text x="956" y="228" class="body">USDC liquidity</text>
  <text x="872" y="292" class="body">• Pays realized trader wins</text>
  <text x="872" y="320" class="body">• Receives losses and fees</text>
  <text x="872" y="348" class="body">• Bears net market exposure</text>
  <text x="872" y="376" class="body">• Must remain solvent</text>

  <path d="M355 235 H447" fill="none" stroke="#63d8ef" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <text x="400" y="218" text-anchor="middle" class="small">price + activity</text>
  <path d="M745 265 H837" fill="none" stroke="#e6ba62" stroke-width="3" marker-end="url(#arrowGold)"/>
  <path d="M837 300 H745" fill="none" stroke="#e6ba62" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="791" y="246" text-anchor="middle" class="small">losses, fees</text>
  <text x="791" y="326" text-anchor="middle" class="small">winning PnL</text>

  <rect x="140" y="444" width="220" height="54" rx="27" fill="#20314d" stroke="#61769b"/>
  <text x="250" y="477" text-anchor="middle" class="tag">Spot depth locked for epoch</text>
  <path d="M250 444 V404" stroke="#8aa0c5" stroke-width="2"/>

  <rect x="490" y="444" width="220" height="54" rx="27" fill="#173a49" stroke="#4c9caf"/>
  <text x="600" y="477" text-anchor="middle" class="tag">Traders post cash margin</text>
  <path d="M600 444 V404" stroke="#63d8ef" stroke-width="2"/>

  <rect x="840" y="444" width="220" height="54" rx="27" fill="#3b3048" stroke="#9c77a8"/>
  <text x="950" y="477" text-anchor="middle" class="tag">Vault LPs underwrite PnL</text>
  <path d="M950 444 V404" stroke="#c49acc" stroke-width="2"/>

  <rect x="65" y="545" width="1070" height="55" rx="14" fill="#0c1729" stroke="#405373"/>
  <text x="600" y="568" text-anchor="middle" class="small">Security condition</text>
  <text x="600" y="590" text-anchor="middle" class="body">Profit reserves and exposure must fit free vault cash and locked reference depth.</text>
</svg>
